#
# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_pre_commit_version = "3.3.0"
default_install_hook_types = [
  "pre-commit",
  "commit-msg"
  ]
default_stages = ["pre-commit"]
exclude = ".sql$"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"
hooks = [
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-xml" },
  { id = "check-merge-conflict" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
  {
    id = "pretty-format-json",
    exclude = {glob = ["app.fotema.Fotema.json", "cargo-sources.json"]},
    args = [
      "--autofix",
      "--indent=4"
    ]
  }
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8"
hooks = [
  {
    id = "conventional-pre-commit",
    name = "conventional-commits",
    stages = ["commit-msg"]
  }
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "83cecb6b523a053d7d3dfdc4798d705b505a88f9"  # frozen: v0.2.78
hooks = [
  {
    id = "rumdl",
    args = ["--fix"]
  },
  {
    id = "rumdl-fmt"
  }
]
